<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MerriDashers</title>
  <link rel="canonical" href="https://merridashers.org/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MerriDashers">
  <meta property="og:title" content="MerriDashers">
  <meta property="og:url" content="https://merridashers.org/">
  <meta property="og:image" content="https://merridashers.org/img/MD%20Text%20dark.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="4000">
  <meta property="og:image:height" content="4000">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="MerriDashers">
  <meta name="twitter:image" content="https://merridashers.org/img/MD%20Text%20dark.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" aria-label="Background video">
    <div class="camera">
      <div class="video-stack">
        <video id="bg-video-a" class="bg-video is-active" autoplay muted playsinline preload="auto"></video>
        <video id="bg-video-b" class="bg-video" muted playsinline preload="auto"></video>
        <video id="slice-video" class="slice-video" muted playsinline preload="auto" aria-hidden="true"></video>
      </div>
    </div>
    <div class="grade" aria-hidden="true"></div>
    <canvas id="grain" class="grain" aria-hidden="true"></canvas>
    <div class="grime" aria-hidden="true"></div>
    <div class="blotches" aria-hidden="true"></div>
    <div class="stripes" aria-hidden="true"></div>
    <div class="tears" aria-hidden="true">
      <span class="tear tear-a"></span>
      <span class="tear tear-b"></span>
      <span class="tear tear-c"></span>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <a class="logo-link" href="https://merrimashers.org" aria-label="MerriDashers">
      <img src="img/MD%20Text.png" alt="MerriDashers" class="logo">
    </a>
  </main>
  <script src="script.js"></script>
</body>
</html>
